name: Deploy BG-01 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the admin panel (via the API) after a content edit, so a publish
  # rebuilds the static site with the latest content from the database.
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pull the latest content from the API into src/content/_generated/ before
      # building. Best-effort: if the API is unreachable the script exits 0 and
      # the build falls back to the committed snapshot, so a deploy never fails
      # on API downtime.
      - run: npm run sync:content
        env:
          API_BASE: ${{ vars.API_BASE || 'https://api.brayangomez.dev' }}
      # VITE_API_BASE_URL is baked into the bundle so /control talks to the
      # production API (not the localhost dev fallback). The build prerenders
      # every public route to dist/<route>.html (served with 200), plus
      # sitemap.xml and 404.html — the SPA fallback for /control and unknown
      # paths (see scripts/prerender.ts).
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE || 'https://api.brayangomez.dev' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
