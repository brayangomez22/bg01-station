<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38e1ff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0b0e16"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#1e2740"/>
  <path d="M24 64V24H64" fill="none" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M1136 24H1176V64" fill="none" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M1176 611V651H1136" fill="none" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M64 651H24V611" fill="none" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- motif: two entry ports (REST, MCP) into one payment core, refund behind a confirm gate -->
  <g transform="translate(540,240)">
    <!-- ports -->
    <g font-size="12" letter-spacing="3" fill="#a9b2c7">
      <rect x="0" y="0" width="120" height="44" fill="#0b0e16" stroke="#38e1ff" stroke-width="1.5"/>
      <text x="60" y="27" text-anchor="middle">REST</text>
      <rect x="0" y="150" width="120" height="44" fill="#0b0e16" stroke="#ffb547" stroke-width="1.5"/>
      <text x="60" y="177" text-anchor="middle">MCP</text>
    </g>
    <g fill="none" stroke="#38e1ff" stroke-width="2">
      <path d="M120 22H190Q210 22 210 42V78Q210 97 232 97H262"/>
      <path d="M120 172H190Q210 172 210 152V116Q210 97 232 97" stroke="#ffb547" stroke-opacity="0.8"/>
    </g>
    <!-- core -->
    <circle cx="330" cy="97" r="130" fill="url(#glow)"/>
    <circle cx="330" cy="97" r="68" fill="#0b0e16" stroke="#38e1ff" stroke-width="2"/>
    <circle cx="330" cy="97" r="48" fill="none" stroke="#38e1ff" stroke-opacity="0.3" stroke-dasharray="3 7"/>
    <path d="M312 97h36M330 79v36" stroke="#38e1ff" stroke-width="2"/>
    <!-- confirm gate: preview -> confirm -->
    <path d="M398 97H450" stroke="#38e1ff" stroke-width="2"/>
    <rect x="450" y="72" width="22" height="50" fill="none" stroke="#38e1ff" stroke-width="1.5"/>
    <path d="M472 97H500" stroke="#38e1ff" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="500" y="72" width="22" height="50" fill="#ffb547" fill-opacity="0.15" stroke="#ffb547" stroke-width="1.5"/>
    <text x="486" y="150" fill="#5c6680" font-size="11" letter-spacing="2" text-anchor="middle">1 → 2</text>
    <!-- outbox -> queue -->
    <path d="M330 165V250H470" fill="none" stroke="#38e1ff" stroke-opacity="0.45" stroke-width="2"/>
    <g fill="#38e1ff" opacity="0.7">
      <rect x="474" y="240" width="14" height="20"/><rect x="494" y="240" width="14" height="20"/><rect x="514" y="240" width="14" height="20" opacity="0.4"/>
    </g>
    <text x="0" y="300" fill="#5c6680" font-size="12" letter-spacing="3">IDEMPOTENCIA · OUTBOX → SQS · OAUTH2 POR SCOPE</text>
  </g>

  <text x="64" y="96" fill="#38e1ff" font-size="26" letter-spacing="6">M-008</text>
  <text x="64" y="130" fill="#a9b2c7" font-size="15" letter-spacing="3">PAYMENTS-MCP · PAGOS PARA AGENTES</text>
  <text x="64" y="156" fill="#5c6680" font-size="13" letter-spacing="2">TYPESCRIPT · POSTGRESQL · MCP · TERRAFORM</text>

  <text x="64" y="615" fill="#5c6680" font-size="12" letter-spacing="3">BG-01 STATION ARCHIVE · STATUS: COMPLETED</text>
  <text x="1136" y="615" fill="#38e1ff" font-size="12" letter-spacing="3" text-anchor="end" opacity="0.6">AGENT TRANSACTION GATE</text>
</svg>
