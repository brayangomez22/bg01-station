      <rect x="234" y="150" width="62" height="80" stroke-opacity="0.45"/>
      <rect x="312" y="150" width="62" height="80" stroke-opacity="0.3"/>
      <rect x="390" y="150" width="62" height="80" stroke="#ffb547" stroke-opacity="0.8"/>
