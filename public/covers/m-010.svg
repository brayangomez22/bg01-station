  <text x="64" y="96" fill="#38e1ff" font-size="26" letter-spacing="6">M-010</text>
  <text x="64" y="130" fill="#a9b2c7" font-size="15" letter-spacing="3">BG-01 · ESTA ESTACIÓN</text>
