    <g stroke="#38e1ff" stroke-opacity="0.35">
      <path d="M12 170H50M12 182H40M90 170H128M90 182H118M168 170H206M168 182H196M246 170H284M246 182H274M324 170H362M324 182H352M402 170H440M402 182H430"/>
