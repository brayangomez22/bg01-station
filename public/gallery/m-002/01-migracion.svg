<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38e1ff" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#38e1ff" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#0b0e16"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect x="24" y="24" width="1392" height="852" fill="none" stroke="#1e2740"/>
  <path d="M24 64V24H64M1376 24H1416V64M1416 836V876H1376M64 876H24V836" fill="none" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="2"/>

  <text x="72" y="96" fill="#38e1ff" font-size="26" letter-spacing="6">M-002 · MIGRACIÓN ANGULAR → REACT</text>
  <text x="72" y="130" fill="#5c6680" font-size="14" letter-spacing="2">40+ MÓDULOS · 2 DESARROLLADORES · 5 MESES · SIN CONGELAR EL DESARROLLO DE FEATURES</text>

  <!-- phase labels -->
  <g font-size="13" letter-spacing="3" fill="#5c6680" text-anchor="middle">
    <text x="245" y="200">ANTES</text>
    <text x="720" y="200">TRANSICIÓN</text>
    <text x="1195" y="200">DESPUÉS</text>
  </g>
  <g fill="none" stroke="#1e2740">
    <rect x="80" y="220" width="330" height="330"/>
    <rect x="555" y="220" width="330" height="330"/>
    <rect x="1030" y="220" width="330" height="330"/>
  </g>

  <!-- module grids: 4x4 each; amber = Angular, cyan = React -->
  <g stroke="#ffb547" stroke-opacity="0.8" fill="#ffb547" fill-opacity="0.12">
    <rect x="110" y="250" width="60" height="44"/><rect x="180" y="250" width="60" height="44"/><rect x="250" y="250" width="60" height="44"/><rect x="320" y="250" width="60" height="44"/>
    <rect x="110" y="304" width="60" height="44"/><rect x="180" y="304" width="60" height="44"/><rect x="250" y="304" width="60" height="44"/><rect x="320" y="304" width="60" height="44"/>
    <rect x="110" y="358" width="60" height="44"/><rect x="180" y="358" width="60" height="44"/><rect x="250" y="358" width="60" height="44"/><rect x="320" y="358" width="60" height="44"/>
    <rect x="110" y="412" width="60" height="44"/><rect x="180" y="412" width="60" height="44"/><rect x="250" y="412" width="60" height="44"/><rect x="320" y="412" width="60" height="44"/>
  </g>
  <text x="245" y="500" fill="#ffb547" font-size="14" text-anchor="middle">ANGULAR</text>

  <g stroke="#38e1ff" fill="#38e1ff" fill-opacity="0.12">
    <rect x="585" y="250" width="60" height="44"/><rect x="655" y="250" width="60" height="44"/><rect x="725" y="250" width="60" height="44"/><rect x="795" y="250" width="60" height="44"/>
    <rect x="585" y="304" width="60" height="44"/><rect x="655" y="304" width="60" height="44"/><rect x="725" y="304" width="60" height="44"/>
    <rect x="585" y="358" width="60" height="44"/><rect x="655" y="358" width="60" height="44"/>
    <rect x="585" y="412" width="60" height="44"/>
  </g>
  <g stroke="#ffb547" stroke-opacity="0.8" fill="#ffb547" fill-opacity="0.12">
    <rect x="795" y="304" width="60" height="44"/>
    <rect x="725" y="358" width="60" height="44"/><rect x="795" y="358" width="60" height="44"/>
    <rect x="655" y="412" width="60" height="44"/><rect x="725" y="412" width="60" height="44"/><rect x="795" y="412" width="60" height="44"/>
  </g>
  <text x="720" y="500" font-size="14" text-anchor="middle"><tspan fill="#38e1ff">REACT</tspan><tspan fill="#5c6680" dx="10">+</tspan><tspan fill="#ffb547" dx="10">ANGULAR</tspan></text>
  <text x="720" y="526" fill="#a9b2c7" font-size="12" text-anchor="middle">el producto sigue operando</text>

  <g stroke="#38e1ff" fill="#38e1ff" fill-opacity="0.12">
    <rect x="1060" y="250" width="60" height="44"/><rect x="1130" y="250" width="60" height="44"/><rect x="1200" y="250" width="60" height="44"/><rect x="1270" y="250" width="60" height="44"/>
    <rect x="1060" y="304" width="60" height="44"/><rect x="1130" y="304" width="60" height="44"/><rect x="1200" y="304" width="60" height="44"/><rect x="1270" y="304" width="60" height="44"/>
    <rect x="1060" y="358" width="60" height="44"/><rect x="1130" y="358" width="60" height="44"/><rect x="1200" y="358" width="60" height="44"/><rect x="1270" y="358" width="60" height="44"/>
    <rect x="1060" y="412" width="60" height="44"/><rect x="1130" y="412" width="60" height="44"/><rect x="1200" y="412" width="60" height="44"/><rect x="1270" y="412" width="60" height="44"/>
  </g>
  <text x="1195" y="500" fill="#38e1ff" font-size="14" text-anchor="middle">REACT</text>

  <g stroke="#38e1ff" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M420 385H545"/><path d="M895 385H1020"/>
  </g>

  <!-- shared component system feeding the migrated modules -->
  <rect x="555" y="590" width="805" height="56" fill="#38e1ff" fill-opacity="0.06" stroke="#38e1ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="957" y="624" fill="#38e1ff" font-size="14" letter-spacing="3" text-anchor="middle">SISTEMA DE COMPONENTES REUTILIZABLES</text>
  <g stroke="#38e1ff" stroke-opacity="0.35" stroke-dasharray="3 5">
    <path d="M720 550V590M1195 550V590"/>
  </g>

  <!-- confirmed results -->
  <g font-size="13" letter-spacing="3" fill="#5c6680">
    <text x="80" y="720">MÓDULOS MIGRADOS</text>
    <text x="520" y="720">BUNDLE INICIAL</text>
    <text x="960" y="720">RENDIMIENTO DEL FRONTEND</text>
  </g>
  <g font-size="40" fill="#38e1ff">
    <text x="80" y="772">40+</text>
    <text x="520" y="772">−38 %</text>
    <text x="960" y="772">+40 %</text>
  </g>

  <text x="1360" y="840" fill="#5c6680" font-size="11" letter-spacing="2" text-anchor="end">ESQUEMÁTICO ILUSTRATIVO · NO REPRESENTA LA ARQUITECTURA REAL DEL CLIENTE</text>
</svg>
