<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38e1ff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#38e1ff" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#0b0e16"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect x="24" y="24" width="1392" height="852" fill="none" stroke="#1e2740"/>
  <path d="M24 64V24H64M1376 24H1416V64M1416 836V876H1376M64 876H24V836" fill="none" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="2"/>

  <text x="72" y="96" fill="#38e1ff" font-size="26" letter-spacing="6">M-004 · PLATAFORMAS ROFÉ</text>
  <text x="72" y="130" fill="#5c6680" font-size="14" letter-spacing="2">DOS PLATAFORMAS · NESTJS + ANGULAR + MYSQL · DESPLIEGUE EN AZURE</text>

  <!-- Azure boundary -->
  <rect x="64" y="176" width="1312" height="452" fill="none" stroke="#38e1ff" stroke-opacity="0.25" stroke-dasharray="6 8"/>
  <text x="88" y="204" fill="#5c6680" font-size="12" letter-spacing="3">MICROSOFT AZURE · PRODUCCIÓN</text>

  <!-- platforms (left) -->
  <g font-size="15" letter-spacing="2" text-anchor="middle">
    <g fill="#0b0e16" stroke="#a9b2c7" stroke-opacity="0.6">
      <rect x="110" y="266" width="320" height="96"/>
      <rect x="110" y="442" width="320" height="96"/>
    </g>
    <g fill="#a9b2c7">
      <text x="270" y="306">MUJERES ROFÉ</text>
      <text x="270" y="482">JÓVENES CREATIVOS</text>
    </g>
    <g fill="#5c6680" font-size="12" letter-spacing="1">
      <text x="270" y="332">independencia económica · Angular</text>
      <text x="270" y="508">formación para el trabajo · Angular</text>
    </g>
  </g>

  <!-- REST into the backend -->
  <g stroke="#38e1ff" stroke-opacity="0.7" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M430 314C520 314 540 380 588 392"/>
    <path d="M430 490C520 490 540 424 588 412"/>
  </g>
  <text x="510" y="566" fill="#5c6680" font-size="12" letter-spacing="2" text-anchor="middle">API REST</text>

  <!-- backend core -->
  <g transform="translate(720,402)">
    <circle r="190" fill="url(#glow)"/>
    <rect x="-130" y="-80" width="260" height="160" fill="#0b0e16" stroke="#38e1ff" stroke-width="2"/>
    <rect x="-112" y="-62" width="224" height="124" fill="none" stroke="#38e1ff" stroke-opacity="0.35" stroke-dasharray="4 6"/>
    <text y="-6" fill="#38e1ff" font-size="16" letter-spacing="3" text-anchor="middle">BACKEND</text>
    <text y="20" fill="#38e1ff" font-size="13" text-anchor="middle">NestJS</text>
  </g>

  <!-- database (right) -->
  <path d="M850 402H1030" fill="none" stroke="#38e1ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1040" y="342" width="280" height="120" fill="#38e1ff" fill-opacity="0.06" stroke="#38e1ff" stroke-opacity="0.7"/>
  <text x="1180" y="396" fill="#38e1ff" font-size="15" letter-spacing="2" text-anchor="middle">MYSQL</text>
  <text x="1180" y="422" fill="#a9b2c7" font-size="12" text-anchor="middle">persistencia</text>

  <!-- verifiable facts -->
  <g font-size="13" letter-spacing="3" fill="#5c6680">
    <text x="80" y="720">PLATAFORMAS</text>
    <text x="520" y="720">DURACIÓN</text>
    <text x="960" y="720">ENTREGA</text>
  </g>
  <g font-size="40" fill="#38e1ff">
    <text x="80" y="772">2</text>
    <text x="520" y="772">16 meses</text>
    <text x="960" y="772">end-to-end</text>
  </g>

  <text x="1360" y="840" fill="#5c6680" font-size="11" letter-spacing="2" text-anchor="end">ESQUEMÁTICO ILUSTRATIVO · CÓDIGO Y CAPTURAS BAJO ACUERDO DE CONFIDENCIALIDAD</text>
</svg>
